name: CI

# 三平台验证是 M0 留下的唯一红灯（MVP-SCOPE：M0 的目的是把跨平台不确定性撞碎）。
# 这个 workflow 只做「能重复跑出来的事」：编译、静态检查、测试、前端构建。
# 需要 GUI / 原生对话框 / 真实掉电的验收不在这里，见 docs/M1-KICKOFF.md 第 1 节。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 版本跟根 package.json 的 packageManager 保持一致，两处一起改。
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile：锁文件和 package.json 不一致就失败，而不是悄悄升级依赖。
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @knowisle/desktop typecheck
      - run: pnpm --filter @knowisle/desktop lint
      - run: pnpm --filter @knowisle/desktop build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ matrix.os }}

      # 格式与平台无关，只跑一次。
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # 只 lint 四个纯逻辑 crate：src-tauri 的 clippy 需要 Linux 系统库，
      # 而它本身几乎没有逻辑，编译验证交给下面的 shell job。
      #
      # ki-store 放在这里而不是 shell job：它只依赖 rusqlite（bundled C 源码，
      # 三平台自带编译器就够）和 ki-core，**不碰 tauri**。这是分层设计带来的
      # 直接好处——索引库的全部测试能在 20 分钟的 rust job 里三平台跑完。
      # ki-search 是零依赖的纯函数层，跑完只要 0.01 秒。
      - name: Clippy
        run: cargo clippy -p ki-core -p ki-vault -p ki-search -p ki-store --all-targets -- -D warnings

      - name: Test
        run: cargo test -p ki-core -p ki-vault -p ki-search -p ki-store

      # 公理 A2 的机械形式：领域层与纯逻辑层不许长出基础设施依赖。
      #
      # 这条守卫的价值不在今天——今天它显然是空的——而在「哪天有人为了让
      # `KiError::Index` 好写一点，顺手在 ki-core 里 `use rusqlite`」的那一刻。
      # 那时 `cargo tree` 会红，而 code review 里没人会注意到多了一行依赖。
      #
      # `ki-search` 必须保持零依赖：它要能用十万组随机 case 做 property test
      # 而不链 SQLite（毫秒级）。一旦它依赖了 rusqlite，那套测试就变成分钟级，
      # 于是没人会跑。
      #
      # 用 `-e normal` 排除 dev-dependencies：测试里用什么是另一回事。
      - name: Layering guard (core / vault / search stay IO-free)
        run: |
          if cargo tree -p ki-core -p ki-vault -p ki-search -e normal \
               | grep -qiE 'rusqlite|libsqlite3'; then
            echo "::error::ki-core / ki-vault / ki-search 依赖了 SQLite，违反公理 A2"
            cargo tree -p ki-core -p ki-vault -p ki-search -e normal
            exit 1
          fi

  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # 三平台统一用 bash。Windows runner 的默认 shell 是 pwsh，
    # 而 pwsh 执行 `./scripts/x.sh` 既不会报错也不会执行——直接"成功"退出，
    # 于是崩溃一致性测试在 Windows 上曾经是假绿（0.7 秒、零输出）。
    # 这个 job 里既有 shell 脚本又有 `\` 续行，统一到 bash 比逐个加 shell: 更难漏。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: shell-${{ matrix.os }}

      # Tauri 的 generate_context! 要把前端产物嵌进二进制，所以先 build 前端。
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knowisle/desktop build

      # 编译整个壳（含 tauri / 插件 / capabilities），不打包安装器：
      # 打包需要签名证书，MVP 阶段不做。
      - run: cargo build --locked -p knowisle

      # 命令层（ki-ipc）的 lint 与测试放在这里，不放在 rust job：
      # tauri 在 Linux 上对 gtk 是无条件依赖，本 job 已经装了系统库。
      # 这就是把命令层从 src-tauri 挪出来的理由——那边永远测不了。
      - name: Clippy (ki-ipc)
        run: cargo clippy -p ki-ipc --all-targets -- -D warnings

      - name: Test (ki-ipc)
        run: cargo test -p ki-ipc

      # M1 唯一不可妥协的验收项：写入途中被硬杀，磁盘上只允许出现
      # 完整的旧内容或完整的新内容。三个平台都跑——Windows 走 TerminateProcess，
      # Unix 走 SIGKILL，两者都是不给清理机会的硬杀。
      - name: Crash consistency (kill -9)
        run: ./scripts/crash-note-save.sh

      # IPC 契约 drift 校验：`bindings.ts` 是从 Rust command 签名生成的，
      # 与 `Cargo.lock` 一样属于"生成物但必须入库"。重新生成一遍，
      # 工作区只要有任何差异就说明有人改了命令却忘了提交生成结果。
      #
      # 放在 shell job 而不是 frontend job：生成器要链接 tauri，需要系统依赖。
      # 三个平台都跑，因为"生成结果与平台无关"本身也是要守的性质——
      # 一旦哪天导出器开始写绝对路径或 CRLF，这里会立刻红。
      - name: IPC bindings drift
        run: pnpm --filter @knowisle/desktop bindings:check

  # release 版的启动冒烟。只在 Windows 上跑：K1 靠 Win32 EnumWindows 判「窗口可见」，
  # 是 Windows 口径。
  #
  # 为什么不在 shell job 里顺带跑：那个 job 用 `cargo build`（debug）——
  # debug 版连的是 devUrl，起来的是「连不上 vite 的空白页」。release 版必须
  # 走 `tauri build`，它才会关掉 dev cfg 并把前端嵌进二进制。所以这个 job 的
  # 独有价值是「`tauri build` 产出的那个二进制真的能起来」，K1 只是顺手带的数。
  #
  # 阈值刻意留得很松（1500ms），因为这是共享 runner：同样的代码在不同负载下
  # 能差一倍。它卡的是**灾难性回归**（有人在 setup 里塞了同步阻塞），
  # 不是「比上次慢了 80ms」。真正的启动基线在本机量，见 docs/ARCHITECTURE.md。
  perf:
    name: perf (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 实测结论先写在这里，免得下一个人再猜一遍：windows-latest **是**预装
      # WebView2 运行时的（2026-10-25 那次日志：`WebView2 runtime 已存在:
      # 155.0.4283.62`）。所以 K2 起不来跟运行时无关。
      #
      # 这一步保留的理由只剩两个：把版本号打进日志（下次镜像变了能立刻看见），
      # 以及万一哪天 Server 镜像真的不再预装，这里能自动补上而不是让人对着
      # 「调试端口没开」发呆。
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid"
          )
          $ver = $null
          foreach ($k in $keys) {
            if (Test-Path $k) {
              $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
              if ($v) { $ver = $v; break }
            }
          }
          if ($ver) {
            Write-Output "WebView2 runtime 已存在: $ver"
            exit 0
          }
          Write-Output "WebView2 runtime 缺失，装 bootstrapper"
          $exe = Join-Path $env:TEMP 'MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList '/silent', '/install' -Wait
          foreach ($k in $keys) {
            if (Test-Path $k) {
              $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
              if ($v) { Write-Output "安装完成: $v"; exit 0 }
            }
          }
          Write-Output "::error::WebView2 运行时安装后仍未检测到"
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-windows

      - run: pnpm install --frozen-lockfile

      # 必须是 `tauri build`，不能是 `cargo build --release`：后者产出的二进制
      # 仍指向 devUrl（tauri-build 只在 `tauri build` 环境里才关 dev cfg 并
      # 把前端嵌进二进制），量出来的是「连不上 vite 的空白页有多快」。
      - name: Build release binary
        working-directory: apps/desktop
        run: pnpm exec tauri build --no-bundle --ci

      - name: K1 窗口首次可见
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass \
            -File scripts/perf-window-visible.ps1 \
            -Exe target/release/knowisle.exe -Rounds 5 -LimitMs 1500

      # K2（侧栏树渲染完）与空载内存**故意不在这里**。三次实测的结论：
      #
      #   WebView2 runtime 已存在: 155.0.4283.62
      #   子孙进程: msedgewebview2.exe
      #   /json/version → 连不上 | /json/list → 连不上
      #
      # 运行时在、浏览器进程也起来了，但 `--remote-debugging-port` 就是不监听。
      # 换过 `--disable-gpu`、换过端口（9222 → 内核分配的 51397，避开 Hyper-V
      # 预留区间），三次重试全败。Chromium 绑不上调试端口时是**静默放弃**
      # DevTools 的，所以这条路在托管 runner 上没法走。
      #
      # 旁证：K1 在 runner 上只要 12–15ms，本机是 200–400ms——runner 上的
      # WebView2 并没有真正接上（服务会话、无交互桌面、无显卡）。
      #
      # 所以 K2 与内存预算退回**本机卡口**：node scripts/perf-coldstart.mjs。
      # 数字与口径见 docs/ARCHITECTURE.md 2.7。哪天 runner 换了环境想再试，
      # 脚本已经能自己把病因打出来，直接加回一个 step 即可。
