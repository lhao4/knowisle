name: CI

# 三平台验证是 M0 留下的唯一红灯（MVP-SCOPE：M0 的目的是把跨平台不确定性撞碎）。
# 这个 workflow 只做「能重复跑出来的事」：编译、静态检查、测试、前端构建。
# 需要 GUI / 原生对话框 / 真实掉电的验收不在这里，见 docs/M1-KICKOFF.md 第 1 节。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 版本跟根 package.json 的 packageManager 保持一致，两处一起改。
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile：锁文件和 package.json 不一致就失败，而不是悄悄升级依赖。
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @knowisle/desktop typecheck
      - run: pnpm --filter @knowisle/desktop lint
      - run: pnpm --filter @knowisle/desktop build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ matrix.os }}

      # 格式与平台无关，只跑一次。
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # 只 lint 两个纯逻辑 crate：src-tauri 的 clippy 需要 Linux 系统库，
      # 而它本身几乎没有逻辑，编译验证交给下面的 shell job。
      - name: Clippy
        run: cargo clippy -p ki-core -p ki-vault --all-targets -- -D warnings

      - name: Test
        run: cargo test -p ki-core -p ki-vault

  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # 三平台统一用 bash。Windows runner 的默认 shell 是 pwsh，
    # 而 pwsh 执行 `./scripts/x.sh` 既不会报错也不会执行——直接"成功"退出，
    # 于是崩溃一致性测试在 Windows 上曾经是假绿（0.7 秒、零输出）。
    # 这个 job 里既有 shell 脚本又有 `\` 续行，统一到 bash 比逐个加 shell: 更难漏。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: shell-${{ matrix.os }}

      # Tauri 的 generate_context! 要把前端产物嵌进二进制，所以先 build 前端。
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knowisle/desktop build

      # 编译整个壳（含 tauri / 插件 / capabilities），不打包安装器：
      # 打包需要签名证书，MVP 阶段不做。
      - run: cargo build --locked -p knowisle

      # 命令层（ki-ipc）的 lint 与测试放在这里，不放在 rust job：
      # tauri 在 Linux 上对 gtk 是无条件依赖，本 job 已经装了系统库。
      # 这就是把命令层从 src-tauri 挪出来的理由——那边永远测不了。
      - name: Clippy (ki-ipc)
        run: cargo clippy -p ki-ipc --all-targets -- -D warnings

      - name: Test (ki-ipc)
        run: cargo test -p ki-ipc

      # M1 唯一不可妥协的验收项：写入途中被硬杀，磁盘上只允许出现
      # 完整的旧内容或完整的新内容。三个平台都跑——Windows 走 TerminateProcess，
      # Unix 走 SIGKILL，两者都是不给清理机会的硬杀。
      - name: Crash consistency (kill -9)
        run: ./scripts/crash-note-save.sh

      # IPC 契约 drift 校验：`bindings.ts` 是从 Rust command 签名生成的，
      # 与 `Cargo.lock` 一样属于"生成物但必须入库"。重新生成一遍，
      # 工作区只要有任何差异就说明有人改了命令却忘了提交生成结果。
      #
      # 放在 shell job 而不是 frontend job：生成器要链接 tauri，需要系统依赖。
      # 三个平台都跑，因为"生成结果与平台无关"本身也是要守的性质——
      # 一旦哪天导出器开始写绝对路径或 CRLF，这里会立刻红。
      - name: IPC bindings drift
        run: pnpm --filter @knowisle/desktop bindings:check

  # 冷启动与空载内存。只在 Windows 上跑：K1 靠 Win32 EnumWindows 判「窗口可见」，
  # K2 靠 CDP 判「树渲染完」，两者都是 Windows 口径。
  #
  # 为什么不在 shell job 里顺带跑：那个 job 用 `cargo build`（debug）——
  # debug 版连的是 devUrl，量出来的是「页面加载失败有多快」。release 版必须
  # 走 `tauri build`，它才会关掉 dev cfg 并把前端嵌进二进制。
  #
  # 阈值刻意留得很松（K1 1500ms / K2 5000ms），因为这是共享 runner：
  # 同样的代码在不同负载下能差一倍。这两条卡的是**灾难性回归**
  # （有人在 setup 里塞了同步阻塞、有人把整个库一次性读进内存），
  # 不是「比上次慢了 80ms」。真正的启动基线在本机量，见 docs/ARCHITECTURE.md。
  perf:
    name: perf (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 这条不是可选的准备工作，是实测出来的前提：缺 WebView2 运行时的时候，
      # 应用进程**照样活着**、窗口照样创建（所以 K1 会过），但 WebView2 永远
      # 初始化不出来，表现为「调试端口 30 秒没开、进程仍在」。三次重试都一样，
      # 因为缺的东西不会因为重试而出现。
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid"
          )
          $ver = $null
          foreach ($k in $keys) {
            if (Test-Path $k) {
              $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
              if ($v) { $ver = $v; break }
            }
          }
          if ($ver) {
            Write-Output "WebView2 runtime 已存在: $ver"
            exit 0
          }
          Write-Output "WebView2 runtime 缺失，装 bootstrapper"
          $exe = Join-Path $env:TEMP 'MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList '/silent', '/install' -Wait
          foreach ($k in $keys) {
            if (Test-Path $k) {
              $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
              if ($v) { Write-Output "安装完成: $v"; exit 0 }
            }
          }
          Write-Output "::error::WebView2 运行时安装后仍未检测到"
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-windows

      - run: pnpm install --frozen-lockfile

      # 必须是 `tauri build`，不能是 `cargo build --release`：后者产出的二进制
      # 仍指向 devUrl（tauri-build 只在 `tauri build` 环境里才关 dev cfg 并
      # 把前端嵌进二进制），量出来的是「连不上 vite 的空白页有多快」。
      - name: Build release binary
        working-directory: apps/desktop
        run: pnpm exec tauri build --no-bundle --ci

      - name: K1 窗口首次可见
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass \
            -File scripts/perf-window-visible.ps1 \
            -Exe target/release/knowisle.exe -Rounds 5 -LimitMs 1500

      - name: K2 树渲染完 + 空载内存
        env:
          PERF_ROUNDS: 5
          PERF_K2_MS: 5000
          PERF_SELF_MB: 40
        run: node scripts/perf-coldstart.mjs
