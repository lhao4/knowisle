[package]
name = "knowisle"
description = "知屿 KnowIsle · 本地优先的 Markdown 知识库"
authors = ["KnowIsle"]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

# Tauri 2 要求 lib 目标；移动端入口也从这里导出。
[lib]
name = "knowisle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
ki-core = { workspace = true }
ki-vault = { workspace = true }
