[package]
name = "knowisle"
description = "知屿 KnowIsle · 本地优先的 Markdown 知识库"
authors = ["KnowIsle"]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

# 本 crate 有两个 bin：应用本体 `knowisle` 与契约导出器 `export_bindings`。
# 有第二个 bin 之后 `cargo run` 会变成歧义错误，`tauri dev` 随之失效——
# 这一行是让 `cargo run` 默认落到应用本体的唯一开关，别删。
default-run = "knowisle"

# Tauri 2 要求 lib 目标；移动端入口也从这里导出。
[lib]
name = "knowisle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 契约导出器只在开发时需要，所以用 feature 门控。
#
# 不加门控的后果是实测出来的：`tauri build` 会把**所有** bin 一起塞进安装包，
# NSIS 载荷里于是多出 3.76MB 的 export_bindings.exe（占 38%），
# 而且把一个纯内部工具发给了用户。它也不该被 CI 的 `cargo build -p knowisle` 顺带编出来。
bindings-export = []

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["bindings-export"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ki-ipc = { workspace = true }

# 只有契约导出器（src/bin/export_bindings.rs）需要它。
# 命令层与类型定义都在 ki-ipc / ki-core，本 crate 不碰 specta 的细节。
specta-typescript = { workspace = true }
