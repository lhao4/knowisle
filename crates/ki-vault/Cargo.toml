[package]
name = "ki-vault"
description = "知屿 KnowIsle 的 Vault 文件系统层：扫描、路径安全、读取"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ki-core = { workspace = true }
serde = { workspace = true }
# 回收站清单（`.knowisle/trash/manifest/*.json`）的唯一用途。
# 它**不是**第二份数据存储：一条记录只有 origin + deletedAt，正文仍在 Markdown 里。
serde_json = { workspace = true }
walkdir = { workspace = true }
dunce = { workspace = true }

[dev-dependencies]
tempfile = "3"
