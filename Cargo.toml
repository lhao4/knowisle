[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/ki-core",
    "crates/ki-ipc",
    "crates/ki-search",
    "crates/ki-store",
    "crates/ki-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
ki-core = { path = "crates/ki-core" }
ki-ipc = { path = "crates/ki-ipc" }
ki-search = { path = "crates/ki-search" }
ki-store = { path = "crates/ki-store" }
ki-vault = { path = "crates/ki-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2.5"
dunce = "1"

# ---- SQLite ----
# `bundled` 会**顺带**开 FTS5：libsqlite3-sys 的 bundled 构建脚本里写死了
# `-DSQLITE_ENABLE_FTS5`，不需要额外 feature（也没有单独的 `fts5` feature）。
# 版本钉在 0.32 是因为它 bundled 的 SQLite 是 3.46，而 `contentless_delete`
# 要求 3.43+；再往上的 rusqlite 会把 workspace 的 MSRV 1.82 顶掉。
# 索引库对 SQLite 的依赖只有两处不可替代的能力：FTS5 与 contentless_delete。
rusqlite = { version = "0.32", features = ["bundled"] }

# ---- IPC 类型生成（tauri-specta）----
# 三行必须同时升级，且必须用 `=` 精确钉死，理由不是洁癖：
#   tauri-specta 对 specta 的依赖是 `=2.0.0-rc.26`（精确相等，不是 ^）。
# 一旦这里的 specta 解析成另一个 rc，cargo 会同时装两个 specta，
# `#[derive(specta::Type)]` 实现的是 A 版本，tauri-specta 要的是 B 版本，
# 报错是 "the trait bound `Foo: specta::Type` is not satisfied" —— 而你明明已经 derive 了。
# specta 与 tauri-specta 都是 rc 预发布版，语义化版本规则下 `"2"` 根本匹配不到它们。
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

# ---- 发布构建 ----
# 默认 release（opt-level=3 / 无 LTO / codegen-units=16 / 不 strip）产出 10.3MB。
# 这里换的是三件事：让优化跨 crate 生效（thin LTO）、把代码生成收成单单元、
# 以及剥掉符号。目标是**更少的页要缺页进来**——启动时省的是 IO 与重定位，
# 不是 CPU。
#
# 不用 `lto = true`（fat）：那是全程序单线程优化，对 400 多个依赖 crate 的
# Tauri 树要编译十几分钟，换来的边际收益只有几 MB。
# 不用 `panic = "abort"`：省不了多少，却会改掉 unwind 语义，
# 把 `catch_unwind` 一类兜底悄悄变成进程直接死。
[profile.release]
codegen-units = 1
lto = "thin"
strip = true

