[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/ki-core",
    "crates/ki-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
ki-core = { path = "crates/ki-core" }
ki-vault = { path = "crates/ki-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2.5"
dunce = "1"
